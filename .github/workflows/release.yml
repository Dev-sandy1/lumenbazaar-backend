name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA to bind the release artifacts to (default: current HEAD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-release-artifacts:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate schema and code consistency
        run: pnpm check

      - name: Generate immutable release artifacts with commit
        env:
          RELEASE_COMMIT: ${{ inputs.target_commit || github.sha }}
        run: |
          pnpm openapi:generate
          echo "Generated release artifacts for commit ${RELEASE_COMMIT}"

      - name: Verify artifact checksums
        run: |
          cd docs/api
          sha256sum -c checksums.sha256
          cd ../..

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumenbazaar-api-release-artifacts
          path: |
            docs/api/openapi.json
            docs/api/openapi.md
            docs/api/conformance.json
            docs/api/conformance.md
            docs/api/checksums.json
            docs/api/checksums.sha256
          retention-days: 90

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/api/openapi.json
            docs/api/openapi.md
            docs/api/conformance.json
            docs/api/conformance.md
            docs/api/checksums.json
            docs/api/checksums.sha256
          generate_release_notes: true
