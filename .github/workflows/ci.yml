name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run checks
        run: pnpm check

      - name: Verify release artifact checksums
        run: |
          cd docs/api
          sha256sum -c checksums.sha256
          cd ../..

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Validate testnet release configuration
        run: pnpm deploy:testnet:check

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Verify migrations from empty database
        run: pnpm prisma:migrations:verify
        env:
          MAINTENANCE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Run migration integration tests
        run: pnpm prisma:migrations:test
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumenbazaar_migration_test

      - name: Clean up test databases
        if: always()
        run: pnpm prisma:migrations:cleanup
        env:
          MAINTENANCE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
